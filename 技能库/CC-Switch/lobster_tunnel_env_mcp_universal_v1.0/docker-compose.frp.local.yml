services:
  frps:
    image: snowdreamtech/frps:0.68.1
    command: ["frps", "-c", "/etc/frp/frps.toml"]
    ports:
      - "127.0.0.1:17000:17000"
      - "127.0.0.1:19100:19100"
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
    restart: unless-stopped

  frpc:
    image: snowdreamtech/frpc:0.68.1
    command: ["frpc", "-c", "/etc/frp/frpc.toml"]
    depends_on:
      - frps
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro
    restart: unless-stopped
