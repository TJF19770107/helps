# global-stock-data 量化数据技能包
# CC Switch Skill 配置文件
# 生成时间: 2026-06-19

skill:
  name: "global-stock-data"
  display_name: "美股港股全栈量化数据技能包"
  version: "1.0.0"
  author: "simonlin1212"
  description: "美股港股全栈数据工具包 — 8层架构·18个端点·5个数据源·全部零鉴权·仅依赖requests"
  license: "Apache-2.0"
  repository: "https://github.com/simonlin1212/global-stock-data"

capabilities:
  - name: "美股实时行情"
    endpoints: ["新浪gb_", "腾讯us", "东财push2 105/106/107"]
    fields: "25-78个字段"
  - name: "港股实时行情"
    endpoints: ["腾讯r_hk", "新浪rt_hk", "东财push2 116"]
    fields: "25-78个字段"
  - name: "K线数据"
    endpoints: ["新浪日K(回溯至1984)", "Yahoo chart(日/周/月/分钟)"]
  - name: "技术指标"
    indicators: ["MA/EMA", "MACD", "RSI(6/12/24)", "KDJ", "布林带"]
    method: "纯Python计算，零额外依赖"
  - name: "基本面"
    endpoints: ["东财datacenter三表", "东财GMAININDICATOR", "Yahoo quoteSummary(23模块)", "SEC EDGAR XBRL(503个GAAP指标)"]
  - name: "资金面"
    endpoints: ["东财push2his(日级主力/大单/中单/小单)"]
  - name: "期权链(仅美股)"
    endpoints: ["Yahoo options(calls+puts+Greeks)"]
  - name: "SEC Filing(仅美股)"
    endpoints: ["EDGAR submissions", "EDGAR XBRL"]
  - name: "工具层"
    endpoints: ["东财search", "东财push2全市场列表", "Yahoo news", "SEC CIK映射"]

dependencies:
  python: ">=3.8"
  packages:
    - "requests"

data_sources:
  - name: "东方财富"
    protocol: "HTTPS"
    auth: "零鉴权"
    coverage: ["美股", "港股"]
  - name: "新浪财经"
    protocol: "HTTP"
    auth: "零鉴权"
    coverage: ["美股"]
  - name: "腾讯财经"
    protocol: "HTTPS"
    auth: "零鉴权"
    coverage: ["美股", "港股"]
  - name: "Yahoo Finance"
    protocol: "HTTPS"
    auth: "cookie+crumb(自动)"
    coverage: ["美股", "港股"]
  - name: "SEC EDGAR"
    protocol: "HTTPS"
    auth: "User-Agent"
    coverage: ["美股"]

paths:
  primary: "E:\\龙虾AI主控中心\\我的AI分身\\技能库\\global-stock-data\\"
  cc_switch: "C:\\Users\\Administrator\\.cc-switch\\skills\\global-stock-data\\"
  skill_file: "SKILL.md"
  config_file: "skill_config.yaml"

cache:
  directory: "E:\\龙虾AI主控中心\\我的AI分身\\技能库\\global-stock-data\\cache\\"
  ttl_seconds: 300
  description: "数据缓存目录，避免重复请求占用资源"

activation:
  triggers:
    - "美股"
    - "港股"
    - "AAPL/TSLA/BABA/NVDA/MSFT等美股代码"
    - "00700/09988等港股代码"
    - "行情/股价/涨跌幅"
    - "K线/日线/周线/月线"
    - "财报/三表/资产负债表/利润表"
    - "PE/PB/ROE/估值/目标价"
    - "资金流向/主力资金"
    - "期权/call/put"
    - "SEC/10-K/年报/季报"
    - "MACD/RSI/KDJ/布林带/金叉/死叉"
    - "机构持仓/分析师评级"
    - "全市场排名/涨跌幅排名"
