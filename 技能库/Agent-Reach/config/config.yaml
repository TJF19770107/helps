# ============================================================
# Agent-Reach 全局配置文件
# 版本: 1.0.0 | 日期: 2026-06-14
# ============================================================

# ------------------------------
# 网络代理配置 (青云梯)
# ------------------------------
proxy:
  http: "http://127.0.0.1:6738"
  https: "http://127.0.0.1:6738"
  # 白名单域名（直连，不走代理）
  bypass_domains:
    - "localhost"
    - "127.0.0.1"
    - "*.local"

# ------------------------------
# 请求限速配置
# ------------------------------
rate_limit:
  # 全局配置：同一域名两次请求最小间隔（秒）
  default_interval: 3.0
  # 各域名特殊配置（覆盖 default_interval）
  per_domain:
    "twitter.com": 5.0           # Twitter/X 反爬较强
    "x.com": 5.0
    "xiaohongshu.com": 5.0       # 小红书风控严格
    "douyin.com": 4.0            # 抖音
    "bilibili.com": 2.0          # B站相对宽松
    "github.com": 2.0            # GitHub
    "zhihu.com": 4.0
    "weibo.com": 3.0
    "linkedin.com": 5.0
    "reddit.com": 4.0
  # 全局并发上限
  max_concurrent_requests: 3
  # 请求间隔随机抖动范围（秒），防止被识别为机器行为
  jitter_range: [0.5, 2.0]

# ------------------------------
# Cookie/Token 配置（占位）
# ------------------------------
# 重要提示：以下均为占位值，需用户手动填入专用小号 Cookie/Token
# 严禁使用个人主账号 Cookie，必须使用专用小号
credentials:
  twitter:
    cookie: "PLACEHOLDER_需用户手动填入专用小号Cookie"
    auth_token: "PLACEHOLDER_需用户从Cookie-Editor导出"
    note: "使用专用小号，通过Chrome Cookie-Editor扩展导出"
  xiaohongshu:
    cookie: "PLACEHOLDER_需用户手动填入专用小号Cookie"
    note: "小红书风控严格，建议使用已养号一段时间的账号"
  douyin:
    cookie: "PLACEHOLDER_需用户手动填入专用小号Cookie"
    note: "抖音Cookie有效期较短，需定期更新"
  github:
    token: "PLACEHOLDER_需用户手动填入GitHub Personal Access Token"
    note: "用于访问私有仓库，公开仓库无需配置"
  reddit:
    cookie: "PLACEHOLDER_需用户手动填入专用小号Cookie"
    note: "需配合代理使用"
  linkedin:
    cookie: "PLACEHOLDER_需用户手动填入专用小号Cookie"
    note: "仅用于公开页面读取"
  zhihu:
    cookie: "PLACEHOLDER_需用户手动填入专用小号Cookie"
    note: "知乎对频繁访问有限制"

# ------------------------------
# 日志配置
# ------------------------------
logging:
  # 日志目录
  path: "E:\\龙虾AI主控中心\\我的AI分身\\技能库\\Agent-Reach\\logs"
  # 日志级别: DEBUG / INFO / WARN / ERROR
  level: "INFO"
  # 单文件最大大小（MB）
  max_file_size_mb: 50
  # 保留天数
  retention_days: 30
  # 是否输出到控制台
  console: true

# ------------------------------
# 缓存配置
# ------------------------------
cache:
  # 缓存有效期（秒），默认1小时
  ttl: 3600
  # 缓存目录
  path: "E:\\龙虾AI主控中心\\我的AI分身\\技能库\\Agent-Reach\\cache"
  # 最大缓存大小（MB）
  max_size_mb: 500

# ------------------------------
# 安全设置
# ------------------------------
security:
  # 文件权限：仅所有者读写（Windows 通过 icacls 设置）
  file_permission: "owner_only"
  # 禁止访问的内网地址段
  block_private_ips: true
  # 禁止访问的端口
  blocked_ports: [22, 3389, 3306, 5432, 6379, 27017]
  # 最大响应体大小（MB）
  max_response_size_mb: 50

# ------------------------------
# 平台开关
# ------------------------------
platforms:
  web_reading: true          # 通用网页读取（Jina Reader）
  youtube: true              # YouTube 字幕提取
  bilibili: true             # B站字幕提取
  github: true               # GitHub
  rss: true                  # RSS/Atom 订阅
  semantic_search: true      # 全网语义搜索
  twitter: false             # Twitter/X（需配置 Cookie 后启用）
  xiaohongshu: false         # 小红书（需配置 Cookie 后启用）
  douyin: false              # 抖音（需配置 Cookie 后启用）
  weibo: true                # 微博（公开内容可用）
  wechat_public: true        # 微信公众号
  zhihu: false               # 知乎（建议配置 Cookie 后启用）
  linkedin: true             # LinkedIn 公开页面
  reddit: false              # Reddit（需配置 Cookie + 代理后启用）
  v2ex: true                 # V2EX
  xueqiu: true               # 雪球
  xiaoyuzhou: true           # 小宇宙播客

# ------------------------------
# 兜底与容错
# ------------------------------
fallback:
  # Agent-Reach 异常时自动切换方案
  playwright_endpoint: "http://127.0.0.1:9222"
  max_retries: 3
  retry_delay_seconds: 5
  # 切换至 Playwright 的超时阈值（秒）
  switch_timeout: 30
