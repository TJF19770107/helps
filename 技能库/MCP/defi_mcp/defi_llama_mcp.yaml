# Vibe-Trading MCP 连接器：DeFiLlama 生态数据
# 协议: MCP 1.28.0 | 分类: defi_mcp
# 生成: 2026-06-19 | 基准节点: base_20260619_0424_initial_success

name: "defi_llama_mcp"
version: "2.0.0"
description: "DeFiLlama DeFi 生态数据连接器 — TVL/费用/收益，零鉴权"
protocol: "mcp"
protocol_version: "1.28.0"

endpoint:
  type: "rest_api"
  base_url: "https://api.llama.fi"
  endpoints:
    protocols: "/protocols"
    protocol_detail: "/protocol/{slug}"
    chains: "/chains"
    chain_tvl: "/tvl/{chain}"
    protocol_fees: "/fees/{slug}"

auth:
  type: "none"

capabilities:
  - get_all_protocols_tvl
  - get_protocol_detail
  - get_chains_tvl
  - get_chain_history_tvl
  - get_protocol_fees
  - get_protocol_revenue

retry:
  max_attempts: 3
  backoff_strategy: "exponential"
  base_delay_seconds: 5

timeout:
  connect_seconds: 10
  read_seconds: 30
  total_seconds: 45

cache:
  ttl_seconds: 1800
  enabled: true

fallback:
  enabled: true
  source: "coingecko_defi"
  endpoint: "https://api.coingecko.com/api/v3/"

enabled: true
auto_start: true
