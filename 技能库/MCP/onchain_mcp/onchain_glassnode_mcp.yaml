# Vibe-Trading MCP 连接器：Glassnode 链上数据（预留）
# 协议: MCP 1.28.0 | 分类: onchain_mcp
# 生成: 2026-06-19 | 基准节点: base_20260619_0424_initial_success

name: "onchain_glassnode_mcp"
version: "2.0.0"
description: "Glassnode 链上数据连接器 — 提供 MVRV/SOPR/交易所余额/鲸鱼等专业指标"
protocol: "mcp"
protocol_version: "1.28.0"

endpoint:
  type: "rest_api"
  base_url: "https://api.glassnode.com"
  api_version: "v1"
  endpoints:
    metrics: "/v1/metrics/{asset}/{metric}/"

auth:
  type: "api_key"
  key_env: "GLASSNODE_API_KEY"
  source: ".env"
  header: "X-API-KEY"

capabilities:
  - get_mvrv
  - get_sopr
  - get_exchange_balance
  - get_whale_accumulation
  - get_stablecoin_supply
  - get_nupl
  - get_puell_multiple

supported_assets:
  - "BTC"
  - "ETH"

retry:
  max_attempts: 3
  backoff_strategy: "exponential"
  base_delay_seconds: 5

timeout:
  connect_seconds: 10
  read_seconds: 30
  total_seconds: 60

cache:
  ttl_seconds: 3600
  enabled: true

fallback:
  enabled: true
  source: "cryptoquant"
  key_env: "CRYPTOQUANT_API_KEY"

enabled: false
auto_start: false
note: "待配置 GLASSNODE_API_KEY 后启用"
