# Vibe-Trading MCP 连接器：币安行情数据
# 协议: MCP 1.28.0 | 分类: exchange_mcp
# 生成: 2026-06-19 | 基准节点: base_20260619_0424_initial_success

name: "binance_market_data_mcp"
version: "2.0.0"
description: "币安行情数据连接器 — 提供实时/历史K线、订单簿、成交记录"
protocol: "mcp"
protocol_version: "1.28.0"

endpoint:
  type: "ccxt"
  exchange: "binance"
  data_type: "market_data"

auth:
  type: "none"
  note: "公共行情接口零鉴权"

capabilities:
  - fetch_ticker
  - fetch_tickers
  - fetch_ohlcv
  - fetch_order_book
  - fetch_trades
  - fetch_funding_rate
  - fetch_markets

supported_symbols:
  - "BTC/USDT"
  - "ETH/USDT"
  - "SOL/USDT"
  - "BNB/USDT"
  - "XRP/USDT"

timeframes:
  - "1m"
  - "5m"
  - "15m"
  - "1h"
  - "4h"
  - "1d"
  - "1w"

retry:
  max_attempts: 3
  backoff_strategy: "exponential"
  base_delay_seconds: 5

timeout:
  connect_seconds: 10
  read_seconds: 15
  total_seconds: 30

cache:
  ttl_seconds: 60

fallback:
  enabled: true
  source: "yfinance"
  mapping:
    "BTC/USDT": "BTC-USD"
    "ETH/USDT": "ETH-USD"
    "SOL/USDT": "SOL-USD"

enabled: true
auto_start: true
