# Vibe-Trading MCP 连接器：Alternative.me 情绪数据
# 协议: MCP 1.28.0 | 分类: sentiment_mcp
# 生成: 2026-06-19 | 基准节点: base_20260619_0424_initial_success

name: "sentiment_fng_mcp"
version: "2.0.0"
description: "Alternative.me 恐惧贪婪指数 — BTC市场情绪，零鉴权"
protocol: "mcp"
protocol_version: "1.28.0"

endpoint:
  type: "rest_api"
  base_url: "https://api.alternative.me"
  endpoints:
    current: "/fng/?limit=1"
    history: "/fng/?limit={days}"

auth:
  type: "none"

capabilities:
  - get_current_fear_greed
  - get_fng_history
  - get_fng_classification

data_fields:
  - value
  - value_classification
  - timestamp
  - time_until_update

retry:
  max_attempts: 3
  backoff_strategy: "exponential"
  base_delay_seconds: 5
  max_delay_seconds: 30

timeout:
  connect_seconds: 10
  read_seconds: 15
  total_seconds: 30

cache:
  ttl_seconds: 3600
  enabled: true

fallback:
  enabled: true
  source: "coingecko_trending"
  endpoint: "https://api.coingecko.com/api/v3/search/trending"

enabled: true
auto_start: true
