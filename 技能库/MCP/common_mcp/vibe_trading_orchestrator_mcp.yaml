# Vibe-Trading MCP 调度连接器
# 协议: MCP 1.28.0 | 分类: common_mcp
# 生成: 2026-06-19 | 基准节点: base_20260619_0424_initial_success

name: "vibe_trading_orchestrator_mcp"
version: "2.0.0"
description: "Vibe-Trading 总调度连接器 — 协调所有子连接器、数据通路与信号合成"
protocol: "mcp"
protocol_version: "1.28.0"

endpoint:
  type: "orchestrator"
  entry_point: "E:/龙虾AI主控中心/我的AI分身/Vibe-Trading/main.py"

sub_connectors:
  - "binance_spot_mcp"
  - "binance_market_data_mcp"
  - "sentiment_fng_mcp"
  - "onchain_glassnode_mcp"
  - "defi_llama_mcp"
  - "global_stock_data_mcp"

data_pipelines:
  crypto:
    connectors: ["binance_market_data_mcp", "binance_spot_mcp"]
    output: "加密货币行情 + 交易执行"
  onchain:
    connectors: ["onchain_glassnode_mcp"]
    output: "链上指标分析"
  defi:
    connectors: ["defi_llama_mcp"]
    output: "DeFi 生态分析"
  sentiment:
    connectors: ["sentiment_fng_mcp"]
    output: "市场情绪评分"
  stocks:
    connectors: ["global_stock_data_mcp"]
    output: "美股/港股行情 + 基本面"

signal_synthesis:
  dimensions: ["crypto", "onchain", "defi", "sentiment", "stocks"]
  min_dimensions: 3
  confidence_adjustment:
    missing_dimension: -0.15
    conflict_dimension: -0.10

retry:
  max_attempts: 3
  backoff_strategy: "exponential"

timeout:
  total_seconds: 120

enabled: true
auto_start: true
